[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dolaWeb2api-Camoufox"
dynamic = ["version"]
description = "dolaWeb2api-Camoufox - Dola International OpenAI-compatible API gateway powered by native Camoufox & WebDriver BiDi"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "jianli9158" },
]
keywords = ["dola", "dolaWeb2api", "camoufox", "webdriver-bidi", "seedream", "seedance", "openai", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "aiohttp>=3.9",
    "fastapi>=0.100",
    "httpx[socks]>=0.27",
    "Pillow>=10.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.20",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/jianli9158/dolaWeb2api-Camoufox"
Repository = "https://github.com/jianli9158/dolaWeb2api-Camoufox"
Issues = "https://github.com/jianli9158/dolaWeb2api-Camoufox/issues"

[project.scripts]
dolaweb2api = "doubao2api.__main__:main"
doubao2api = "doubao2api.__main__:main"

[project.optional-dependencies]
test = ["pytest>=7.4.3"]

[tool.hatch.version]
path = "doubao2api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["doubao2api"]
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "unit: Unit tests (fast, no browser, no network)",
    "integration: Integration tests (FastAPI TestClient)",
    "live: Live network probes (may require a running service, browser, and account)",
]

